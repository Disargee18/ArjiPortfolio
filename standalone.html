<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argee Boy Paquibot — Windows 95 Portfolio</title>
    <meta
      name="description"
      content="Interactive retro Windows 95 desktop portfolio of Argee Boy Paquibot — Full-Stack Developer, Hackathon Champion, and Student Leader."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>"
    />
    <style>
      /* ============================================================
         AUTHENTIC WINDOWS 95 DESIGN SYSTEM & CONTROLS
         ============================================================ */
      :root {
        --w95-surface: #c0c0c0;
        --w95-surface-light: #dfdfdf;
        --w95-highlight: #ffffff;
        --w95-shadow-dark: #000000;
        --w95-shadow-light: #808080;
        --w95-teal: #008080;
        --w95-navy-dark: #000080;
        --w95-navy-light: #1084d0;
        --w95-title-inactive: #808080;
        --w95-font: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, -apple-system, sans-serif;
        --w95-font-mono: "Fixedsys", "Lucida Console", "Courier New", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: var(--w95-font);
        -webkit-font-smoothing: none;
        font-smooth: never;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: var(--w95-teal);
        user-select: none;
      }

      .win95-raised {
        background-color: var(--w95-surface);
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light);
      }

      .win95-sunken {
        background-color: #ffffff;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light),
          inset -2px -2px 0px var(--w95-surface-light);
      }

      .win95-btn {
        background-color: var(--w95-surface);
        color: #000000;
        border: none;
        font-size: 11px;
        font-weight: 500;
        padding: 3px 12px;
        min-height: 23px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        text-decoration: none;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light);
      }

      .win95-btn:hover {
        filter: brightness(1.02);
      }

      .win95-btn:active,
      .win95-btn.active {
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light),
          inset -2px -2px 0px var(--w95-surface-light);
        padding: 4px 11px 2px 13px;
      }

      .win95-btn:disabled,
      .win95-btn[disabled] {
        color: var(--w95-shadow-light);
        text-shadow: 1px 1px 0 var(--w95-highlight);
        cursor: not-allowed;
        filter: none;
      }

      .win95-titlebar {
        height: 22px;
        padding: 2px 3px 2px 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(90deg, var(--w95-navy-dark) 0%, var(--w95-navy-light) 100%);
        color: #ffffff;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.3px;
        cursor: default;
      }

      .win95-titlebar.inactive {
        background: var(--w95-title-inactive);
        color: #c0c0c0;
      }

      .win95-title-left {
        display: flex;
        align-items: center;
        gap: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .win95-title-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .win95-title-btn {
        width: 16px;
        height: 14px;
        background-color: var(--w95-surface);
        color: #000000;
        border: none;
        font-size: 9px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light);
      }

      .win95-title-btn:active {
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight);
        padding-top: 1px;
        padding-left: 1px;
      }

      .win95-groupbox {
        position: relative;
        border: 2px groove #ffffff;
        padding: 14px 10px 10px 10px;
        margin: 12px 0 8px 0;
        background-color: transparent;
      }

      .win95-groupbox-legend {
        position: absolute;
        top: -8px;
        left: 10px;
        padding: 0 4px;
        background-color: var(--w95-surface);
        font-size: 11px;
        font-weight: 600;
        color: #000000;
      }

      .win95-tabs-container {
        display: flex;
        gap: 2px;
        border-bottom: 2px solid var(--w95-highlight);
        padding: 0 6px;
        margin-bottom: -1px;
        position: relative;
        z-index: 2;
      }

      .win95-tab {
        background-color: var(--w95-surface);
        color: #000000;
        border: none;
        font-size: 11px;
        padding: 4px 10px 3px 10px;
        cursor: pointer;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px 0px 0px var(--w95-shadow-dark),
          inset 0px 1px 0px var(--w95-highlight);
        border-top-left-radius: 3px;
        border-top-right-radius: 3px;
        position: relative;
        top: 1px;
      }

      .win95-tab.active {
        padding: 5px 12px 5px 12px;
        font-weight: bold;
        top: -1px;
        background-color: var(--w95-surface);
        border-bottom: 2px solid var(--w95-surface);
        z-index: 3;
      }

      .win95-statusbar {
        height: 22px;
        display: flex;
        align-items: center;
        padding: 0 4px;
        gap: 4px;
        font-size: 11px;
        background-color: var(--w95-surface);
      }

      .win95-status-field {
        flex: 1;
        height: 18px;
        display: flex;
        align-items: center;
        padding: 0 6px;
        background-color: var(--w95-surface);
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-light),
          inset -1px -1px 0px var(--w95-highlight);
        font-size: 10px;
        color: #333333;
      }

      .win95-status-field.fixed {
        flex: none;
        width: 100px;
        justify-content: center;
      }

      /* Desktop & Icons */
      .w95-desktop {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: var(--w95-teal);
        display: flex;
        flex-direction: column;
      }

      .w95-desktop-icons {
        position: absolute;
        top: 16px;
        left: 16px;
        bottom: 40px;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 20px 24px;
        z-index: 1;
      }

      .w95-desktop-icon {
        width: 76px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1px dotted transparent;
        padding: 4px 2px;
        cursor: pointer;
        text-align: center;
      }

      .w95-desktop-icon:hover {
        background: rgba(0, 0, 128, 0.15);
      }

      .w95-desktop-icon.selected {
        border-color: #ffff80;
        background-color: rgba(0, 0, 128, 0.6);
      }

      .w95-desktop-icon.selected .w95-icon-label {
        background-color: var(--w95-navy-dark);
        color: #ffffff;
      }

      .w95-icon-graphic {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.45));
      }

      .w95-icon-label {
        font-size: 11px;
        color: #ffffff;
        text-shadow: 1px 1px 1px #000000;
        padding: 1px 3px;
        word-break: break-word;
        line-height: 1.2;
      }

      /* Windows Layer */
      .w95-windows-container {
        position: absolute;
        inset: 0;
        bottom: 30px;
        pointer-events: none;
      }

      .w95-window {
        position: absolute;
        display: flex;
        flex-direction: column;
        pointer-events: auto;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light),
          3px 3px 10px rgba(0, 0, 0, 0.4);
        background-color: var(--w95-surface);
        min-width: 320px;
        min-height: 220px;
        overflow: hidden;
      }

      .w95-window.maximized {
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        box-shadow: none;
      }

      .w95-window.minimized {
        display: none;
      }

      .w95-window-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: var(--w95-surface);
        padding: 6px;
      }

      .w95-window-inner-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: var(--w95-surface);
      }

      .w95-resize-handle {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 14px;
        height: 14px;
        cursor: se-resize;
        background: 
          linear-gradient(135deg, transparent 0%, transparent 50%, var(--w95-shadow-light) 50%, var(--w95-shadow-light) 60%, transparent 60%, transparent 70%, var(--w95-shadow-light) 70%, var(--w95-shadow-light) 80%, transparent 80%, transparent 90%, var(--w95-shadow-light) 90%);
      }

      /* Taskbar */
      .w95-taskbar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30px;
        background-color: var(--w95-surface);
        display: flex;
        align-items: center;
        padding: 2px 3px;
        gap: 4px;
        z-index: 9999;
        box-shadow: 
          inset 0 1px 0px var(--w95-highlight),
          inset 0 2px 0px var(--w95-surface-light);
        border-top: 1px solid var(--w95-highlight);
      }

      .w95-start-btn {
        height: 24px;
        padding: 2px 6px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: bold;
        background-color: var(--w95-surface);
        border: none;
        cursor: pointer;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light);
      }

      .w95-start-btn:active,
      .w95-start-btn.active {
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light),
          inset -2px -2px 0px var(--w95-surface-light);
        padding: 3px 5px 1px 7px;
      }

      .w95-logo-quad {
        display: grid;
        grid-template-columns: 7px 7px;
        grid-template-rows: 7px 7px;
        gap: 1px;
        transform: rotate(-10deg) skew(-5deg, -5deg);
      }

      .w95-logo-red { background-color: #ff3333; }
      .w95-logo-green { background-color: #33cc33; }
      .w95-logo-blue { background-color: #0066cc; }
      .w95-logo-yellow { background-color: #ffcc00; }

      .w95-taskbar-tasks {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 3px;
        overflow-x: auto;
        height: 100%;
      }

      .w95-taskbar-item {
        height: 24px;
        max-width: 170px;
        min-width: 110px;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        font-size: 11px;
        background-color: var(--w95-surface);
        border: none;
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        white-space: nowrap;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light);
      }

      .w95-taskbar-item.active {
        background-color: #dedede;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light),
          inset -2px -2px 0px var(--w95-surface-light);
        font-weight: bold;
      }

      .w95-taskbar-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .w95-tray {
        height: 24px;
        padding: 2px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: var(--w95-surface);
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-light),
          inset -1px -1px 0px var(--w95-highlight);
        font-size: 11px;
      }

      .w95-tray-audio-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }

      /* Start Menu */
      .w95-start-menu {
        position: absolute;
        bottom: 30px;
        left: 2px;
        width: 210px;
        background-color: var(--w95-surface);
        display: flex;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark),
          inset 2px 2px 0px var(--w95-surface-light),
          inset -2px -2px 0px var(--w95-shadow-light),
          3px 3px 8px rgba(0, 0, 0, 0.4);
        z-index: 10000;
      }

      .w95-start-sidebar {
        width: 28px;
        background: linear-gradient(180deg, var(--w95-navy-dark) 0%, #000040 100%);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 8px;
      }

      .w95-start-sidebar-text {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: #ffffff;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .w95-start-sidebar-text span {
        color: #c0c0c0;
        font-weight: normal;
      }

      .w95-start-items {
        flex: 1;
        padding: 4px 0;
        display: flex;
        flex-direction: column;
      }

      .w95-start-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        font-size: 11px;
        color: #000000;
        background: none;
        border: none;
        cursor: pointer;
        text-decoration: none;
        text-align: left;
        width: 100%;
      }

      .w95-start-item:hover {
        background-color: var(--w95-navy-dark);
        color: #ffffff;
      }

      .w95-start-divider {
        height: 2px;
        margin: 4px 6px;
        border-top: 1px solid var(--w95-shadow-light);
        border-bottom: 1px solid var(--w95-highlight);
      }

      /* About App */
      .about-app {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 11px;
      }

      .about-hero {
        display: flex;
        gap: 14px;
        padding: 10px;
        background-color: #ffffff;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light),
          inset -2px -2px 0px var(--w95-surface-light);
      }

      .about-avatar-frame {
        width: 72px;
        height: 72px;
        flex-shrink: 0;
        background: linear-gradient(135deg, #000080, #1084d0);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark);
      }

      .about-avatar-initials {
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .about-avatar-sub {
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #ffff80;
      }

      .about-hero-details {
        display: flex;
        flex-direction: column;
        gap: 3px;
        justify-content: center;
      }

      .about-name {
        font-size: 16px;
        font-weight: bold;
        color: var(--w95-navy-dark);
      }

      .about-role {
        font-size: 11px;
        font-weight: 600;
        color: #333333;
      }

      .about-location {
        font-size: 10px;
        color: #555555;
      }

      .about-summary-box {
        padding: 8px 10px;
        line-height: 1.45;
        color: #111111;
        background: #ffffff;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-light),
          inset -1px -1px 0px var(--w95-highlight);
        font-size: 11px;
      }

      .about-skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 10px;
      }

      .about-skill-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 6px;
      }

      .about-skill-header {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-weight: 500;
      }

      .about-meter-track {
        height: 12px;
        background-color: #ffffff;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight);
        padding: 1px;
        display: flex;
      }

      .about-meter-fill {
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          var(--w95-navy-dark) 0px,
          var(--w95-navy-dark) 6px,
          #ffffff 6px,
          #ffffff 8px
        );
      }

      .about-edu-card {
        background: #ffffff;
        padding: 8px;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-light),
          inset -1px -1px 0px var(--w95-highlight);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .about-edu-badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .about-badge {
        background-color: #e8e8e8;
        border: 1px solid #999999;
        padding: 2px 6px;
        font-size: 10px;
        font-weight: bold;
        color: var(--w95-navy-dark);
      }

      .about-contacts-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
      }

      /* Projects App */
      .projects-app {
        display: flex;
        flex-direction: column;
        height: 100%;
        background-color: var(--w95-surface);
      }

      .ie-menubar {
        display: flex;
        gap: 12px;
        padding: 2px 6px;
        font-size: 11px;
        border-bottom: 1px solid var(--w95-shadow-light);
      }

      .ie-toolbar {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 3px 6px;
        border-bottom: 1px solid var(--w95-shadow-light);
      }

      .ie-tool-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2px 6px;
        background: none;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 9px;
      }

      .ie-tool-btn:hover {
        box-shadow: 
          inset 1px 1px 0px var(--w95-highlight),
          inset -1px -1px 0px var(--w95-shadow-dark);
      }

      .ie-address-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-bottom: 2px groove #ffffff;
      }

      .ie-address-input {
        flex: 1;
        height: 20px;
        padding: 0 6px;
        background-color: #ffffff;
        border: none;
        font-size: 11px;
        font-family: var(--w95-font-mono);
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light);
      }

      .ie-viewport {
        flex: 1;
        display: flex;
        overflow: hidden;
        background-color: #ffffff;
        margin: 4px;
        box-shadow: 
          inset 1px 1px 0px var(--w95-shadow-dark),
          inset -1px -1px 0px var(--w95-highlight),
          inset 2px 2px 0px var(--w95-shadow-light);
      }

      .ie-project-sidebar {
        width: 175px;
        background-color: var(--w95-surface);
        border-right: 2px groove #ffffff;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .ie-sidebar-header {
        padding: 6px 8px;
        font-size: 10px;
        font-weight: bold;
        background-color: #dedede;
        border-bottom: 1px solid var(--w95-shadow-light);
      }

      .ie-project-tab-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 8px;
        font-size: 11px;
        text-align: left;
        background: none;
        border: none;
        border-bottom: 1px dotted var(--w95-shadow-light);
        cursor: pointer;
        width: 100%;
      }

      .ie-project-tab-btn.active {
        background-color: var(--w95-navy-dark);
        color: #ffffff;
        font-weight: bold;
      }

      .ie-project-display {

      /* --- SOUND SYNTHESIZER --- */
      class SoundSystem {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }
        init() {
          if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
            const AC = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }
        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }
        playStartup() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [
            { freq: 155.56, start: 0.0, dur: 2.2, gain: 0.2 },
            { freq: 233.08, start: 0.1, dur: 2.4, gain: 0.22 },
            { freq: 311.13, start: 0.25, dur: 2.6, gain: 0.25 },
            { freq: 392.00, start: 0.45, dur: 2.7, gain: 0.25 },
            { freq: 466.16, start: 0.65, dur: 3.0, gain: 0.22 },
            { freq: 622.25, start: 0.85, dur: 3.2, gain: 0.2 },
            { freq: 698.46, start: 1.1, dur: 3.5, gain: 0.18 },
            { freq: 932.33, start: 1.4, dur: 4.0, gain: 0.15 },
          ];
          notes.forEach((n) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.freq, now + n.start);
            gain.gain.setValueAtTime(0.0001, now + n.start);
            gain.gain.exponentialRampToValueAtTime(n.gain, now + n.start + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + n.start + n.dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.start);
            osc.stop(now + n.start + n.dur);
          });
        }
        playClick() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.04);
        }
        playDing() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        }

      async function submitMailForm(e) {
        if (e) e.preventDefault();
        const win = state.windows.mail;
        if (win.isSubmitting) return;

        sounds.playClick();
        if (!win.name.trim() || !win.email.trim() || !win.message.trim()) {
          sounds.playDing();
          win.error = 'Please enter your Name, Email Address, and Message.';
          render();
          return;
        }

        win.isSubmitting = true;
        win.error = '';
        render();

        try {
          const response = await fetch(`https://formsubmit.co/ajax/${PROFILE.email}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              name: win.name.trim(),
              email: win.email.trim(),
              message: win.message.trim(),
              _subject: `Portfolio Message from ${win.name.trim()}`,
              _captcha: 'false',
              _template: 'table'
            })
          });

          const result = await response.json();
          if (response.ok && (result.success === 'true' || result.success === true)) {
            sounds.playDing();
            win.sent = true;
            win.name = '';
            win.email = '';
            win.message = '';
          } else {
            throw new Error(result.message || 'Transmission failed');
          }
        } catch (err) {
          sounds.playDing();
          win.error = 'Transmission failed. Please check your internet connection and try again.';
        } finally {
          win.isSubmitting = false;
          render();
        }
      }

      function resetMailForm() {
        const win = state.windows.mail;
        if (win.isSubmitting) return;
        sounds.playClick();
        win.name = '';
        win.email = '';
        win.message = '';
        win.sent = false;
        win.error = '';
        render();
      }

              <div style="font-size: 40px">💾</div>
              <div class="shutdown-safe-text">It's now safe to turn off your computer.</div>
              <button class="reboot-btn" onclick="restartSystem()">🔄 Restart Portfolio OS</button>
            </div>
          `;
          return;
        }

        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const timeStr = `${hours}:${minutes} ${ampm}`;

        const icons = [
          { id: 'about', label: 'About Me', icon: '👤', hint: 'View Argee Boy Paquibot Profile & Skills' },
          { id: 'projects', label: 'Projects', icon: '🌐', hint: 'Browse Hackathon & Engineering Projects' },
          { id: 'achievements', label: 'Achievements', icon: '🏆', hint: 'View Hackathon Trophies & Awards' },
          { id: 'mail', label: 'Send Message', icon: '✉️', hint: 'Send a message or email directly to Argee' },
          { id: 'recycle', label: 'Recycle Bin', icon: '🗑️', hint: 'Empty' }
        ];

        let html = `
          <div class="w95-desktop" onclick="handleDesktopClick(event)">
            <!-- Icons Grid -->
            <div class="w95-desktop-icons">
              ${icons.map(icon => `
                <div class="w95-desktop-icon ${state.selectedIcon === icon.id ? 'selected' : ''}"
                     onclick="selectIcon(event, '${icon.id}')"
                     ondblclick="openApp('${icon.id}')"
                     title="${icon.hint}">
                  <div class="w95-icon-graphic">${icon.icon}</div>
                  <div class="w95-icon-label">${icon.label}</div>
                </div>
              `).join('')}
            </div>

            <!-- Windows Container -->
            <div class="w95-windows-container">
        `;

        Object.values(state.windows).forEach(win => {
          if (!win.isOpen || win.isMinimized) return;
          const isActive = win.id === state.activeId;
          let bodyHtml = '';
          if (win.id === 'about') bodyHtml = renderAboutApp();
          if (win.id === 'projects') bodyHtml = renderProjectsApp();
          if (win.id === 'achievements') bodyHtml = renderAchievementsApp();
          if (win.id === 'mail') bodyHtml = renderMailApp();

          html += `
            <div class="w95-window ${win.isMaximized ? 'maximized' : ''}"
                 id="win-${win.id}"
                 style="z-index: ${win.zIndex}; left: ${win.isMaximized ? 0 : win.x + 'px'}; top: ${win.isMaximized ? 0 : win.y + 'px'}; width: ${win.isMaximized ? '100%' : win.w + 'px'}; height: ${win.isMaximized ? '100%' : win.h + 'px'}"
                 onmousedown="bringToFront('${win.id}')">
              
              <div class="win95-titlebar ${isActive ? '' : 'inactive'}"
                   onmousedown="startDrag(event, '${win.id}')"
                   ondblclick="toggleMaximize('${win.id}')">
                <div class="win95-title-left">
                  <span style="font-size:13px">${win.icon}</span>
                  <span>${win.title}</span>
                </div>
                <div class="win95-title-controls">
                  <button class="win95-title-btn" onclick="event.stopPropagation(); toggleMinimize('${win.id}')" title="Minimize">_</button>
                  <button class="win95-title-btn" onclick="event.stopPropagation(); toggleMaximize('${win.id}')" title="Maximize">${win.isMaximized ? '❐' : '□'}</button>
                  <button class="win95-title-btn" onclick="event.stopPropagation(); closeApp('${win.id}')" title="Close">✕</button>
                </div>
              </div>

              <div class="w95-window-body">
                <div class="w95-window-inner-content">
                  ${bodyHtml}
                </div>
              </div>

              ${!win.isMaximized ? `<div class="w95-resize-handle" onmousedown="startResize(event, '${win.id}')"></div>` : ''}
            </div>
          `;
        });

        html += `
            </div>

            <!-- Start Menu -->
            ${state.startOpen ? `
              <div class="w95-start-menu" onclick="event.stopPropagation()">
                <div class="w95-start-sidebar">
                  <div class="w95-start-sidebar-text">Windows<span>95</span></div>
                </div>
                <div class="w95-start-items">
                  <button class="w95-start-item" onclick="openApp('about'); state.startOpen=false; render()">
                    <span style="font-size:18px; width:22px; text-align:center">👤</span><span>About Me</span>
                  </button>
                  <button class="w95-start-item" onclick="openApp('projects'); state.startOpen=false; render()">
                    <span style="font-size:18px; width:22px; text-align:center">🌐</span><span>Projects Explorer</span>
                  </button>
                  <button class="w95-start-item" onclick="openApp('achievements'); state.startOpen=false; render()">
                    <span style="font-size:18px; width:22px; text-align:center">🏆</span><span>Achievements</span>
                  </button>
                  <button class="w95-start-item" onclick="openApp('mail'); state.startOpen=false; render()">
                    <span style="font-size:18px; width:22px; text-align:center">✉️</span><span>Send Message / Mail</span>
                  </button>
                  <div class="w95-start-divider"></div>
                  <a href="${PROFILE.linkedinUrl}" target="_blank" rel="noreferrer" class="w95-start-item" onclick="sounds.playClick()">
                    <span style="font-size:18px; width:22px; text-align:center">💼</span><span>LinkedIn Profile</span>
                  </a>
                  <a href="${PROFILE.githubUrl}" target="_blank" rel="noreferrer" class="w95-start-item" onclick="sounds.playClick()">
                    <span style="font-size:18px; width:22px; text-align:center">🐙</span><span>GitHub Profile</span>
                  </a>
                  <a href="mailto:${PROFILE.email}" class="w95-start-item" onclick="sounds.playClick()">
                    <span style="font-size:18px; width:22px; text-align:center">✉️</span><span>Send Email</span>
                  </a>
                  <div class="w95-start-divider"></div>
                  <button class="w95-start-item" onclick="state.showShutdown=true; state.startOpen=false; render()">
                    <span style="font-size:18px; width:22px; text-align:center">🖥️</span><span>Shut Down...</span>
                  </button>
                </div>
              </div>
            ` : ''}

            <!-- Taskbar -->
            <footer class="w95-taskbar">
              <button class="w95-start-btn ${state.startOpen ? 'active' : ''}" onclick="toggleStart(event)">
                <div class="w95-logo-quad">
                  <div class="w95-logo-red"></div>
                  <div class="w95-logo-green"></div>
                  <div class="w95-logo-blue"></div>
                  <div class="w95-logo-yellow"></div>
                </div>
                <span>Start</span>
              </button>

              <div class="w95-taskbar-tasks">
                ${Object.values(state.windows).filter(w => w.isOpen).map(w => {
                  const isCur = w.id === state.activeId && !w.isMinimized;
                  return `
                    <button class="w95-taskbar-item ${isCur ? 'active' : ''}" onclick="handleTaskbarClick('${w.id}')">
                      <span>${w.icon}</span>
                      <span>${w.title}</span>
                    </button>
                  `;
                }).join('')}
              </div>

              <div class="w95-tray">
                <button class="w95-tray-audio-btn" onclick="toggleAudio()" title="${sounds.muted ? 'Unmute' : 'Mute'}">
                  ${sounds.muted ? '🔇' : '🔊'}
                </button>
                <span>${timeStr}</span>
              </div>
            </footer>

            <!-- Shutdown Dialog -->
            ${state.showShutdown ? `
              <div class="shutdown-modal-backdrop" onclick="sounds.playDing()">
                <div class="w95-window shutdown-dialog" onclick="event.stopPropagation()">
                  <div class="win95-titlebar">
                    <div class="win95-title-left">
                      <span>💻</span><span>Shut Down Windows</span>
                    </div>
                    <div class="win95-title-controls">
                      <button class="win95-title-btn" onclick="state.showShutdown=false; render()">✕</button>
                    </div>
                  </div>
                  <div class="shutdown-dialog-content">
                    <div style="font-size:32px">🖥️</div>
                    <div style="display:flex; flex-direction:column; gap:8px">
                      <p>What would you like the computer to do?</p>
                      <label style="display:flex; align-items:center; gap:6px">
                        <input type="radio" checked readonly><span>Shut down</span>
                      </label>
                      <label style="display:flex; align-items:center; gap:6px; color:#888888">
                        <input type="radio" disabled><span>Restart</span>
                      </label>
                    </div>
                  </div>
                  <div style="display:flex; justify-content:flex-end; gap:6px; padding:8px 12px; border-top:1px solid #dfdfdf">
                    <button class="win95-btn" onclick="state.showShutdown=false; state.isShutDown=true; render()">Yes</button>
                    <button class="win95-btn" onclick="state.showShutdown=false; render()">No</button>
                    <button class="win95-btn" onclick="sounds.playDing(); alert('Help: Use the 3 desktop icons to view About Me, Projects, and Achievements!')">Help</button>
                  </div>
                </div>
              </div>
            ` : ''}
          </div>
        `;

        root.innerHTML = html;
      }

      /* Global Interaction Helpers */
      function setAboutTab(tab) {
        sounds.playClick();
        state.windows.about.tab = tab;
        render();
      }

      function selectProject(id) {
        sounds.playClick();
        state.windows.projects.selectedProject = id;
        render();
      }

      function cycleProject(delta) {
        sounds.playClick();
        const curIdx = PROJECTS.findIndex(p => p.id === state.windows.projects.selectedProject);
        const nextIdx = (curIdx + delta + PROJECTS.length) % PROJECTS.length;
        state.windows.projects.selectedProject = PROJECTS[nextIdx].id;
        render();
      }

      function setAwardsFilter(f) {
        sounds.playClick();
        state.windows.achievements.filter = f;
        render();
      }

      function selectAward(id) {
        sounds.playClick();
        state.windows.achievements.selectedAward = id;
        render();
      }

      function toggleStart(e) {
        e.stopPropagation();
        triggerInitialSound();
        sounds.playClick();
        state.startOpen = !state.startOpen;
        render();
      }

      function toggleAudio() {
        const m = sounds.toggleMute();
        if (!m) sounds.playClick();
        render();
      }

      function restartSystem() {
        state.isShutDown = false;
        sounds.playStartup();
        render();
      }

      function handleDesktopClick(e) {
        triggerInitialSound();
        if (!e.target.closest('.w95-desktop-icon') && !e.target.closest('.w95-start-btn') && !e.target.closest('.w95-start-menu')) {
          state.selectedIcon = null;
          state.startOpen = false;
          render();
        }
      }

      function selectIcon(e, id) {
        e.stopPropagation();
        triggerInitialSound();
        sounds.playClick();
        state.selectedIcon = id;
        render();
      }

      function handleTaskbarClick(id) {
        sounds.playClick();
        const win = state.windows[id];
        if (win.isMinimized) {
          bringToFront(id);
        } else if (state.activeId === id) {
          toggleMinimize(id);
        } else {
          bringToFront(id);
        }
      }

      /* Window Dragging */
      let dragState = null;
      function startDrag(e, id) {
        if (e.target.closest('button') || state.windows[id].isMaximized) return;
        bringToFront(id);
        dragState = {
          id,
          startX: e.clientX,
          startY: e.clientY,
          winX: state.windows[id].x,
          winY: state.windows[id].y
        };
      }

      /* Window Resizing */
      let resizeState = null;
      function startResize(e, id) {
        e.stopPropagation();
        bringToFront(id);
        resizeState = {
          id,
          startX: e.clientX,
          startY: e.clientY,
          winW: state.windows[id].w,
          winH: state.windows[id].h
        };
      }

      window.addEventListener('mousemove', e => {
        if (dragState) {
          const dx = e.clientX - dragState.startX;
          const dy = e.clientY - dragState.startY;
          state.windows[dragState.id].x = Math.max(0, Math.min(window.innerWidth - 80, dragState.winX + dx));
          state.windows[dragState.id].y = Math.max(0, Math.min(window.innerHeight - 80, dragState.winY + dy));
          const el = document.getElementById('win-' + dragState.id);
          if (el) {
            el.style.left = state.windows[dragState.id].x + 'px';
            el.style.top = state.windows[dragState.id].y + 'px';
          }
        } else if (resizeState) {
          const dx = e.clientX - resizeState.startX;
          const dy = e.clientY - resizeState.startY;
          state.windows[resizeState.id].w = Math.max(340, resizeState.winW + dx);
          state.windows[resizeState.id].h = Math.max(240, resizeState.winH + dy);
          const el = document.getElementById('win-' + resizeState.id);
          if (el) {
            el.style.width = state.windows[resizeState.id].w + 'px';
            el.style.height = state.windows[resizeState.id].h + 'px';
          }
        }
      });

      window.addEventListener('mouseup', () => {
        dragState = null;
        resizeState = null;
      });

      // Clock interval
      setInterval(() => {
        if (!state.isShutDown) render();
      }, 1000);

      // Initial Mount
      render();
    </script>
  </body>
</html>
